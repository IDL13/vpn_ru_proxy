name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            sing_box_platform: darwin-arm64
            sing_box_format: tar.gz
            interface: lo0
            executable: vpn-ru-proxy
          - runner: ubuntu-22.04
            platform: linux-x64
            sing_box_platform: linux-amd64
            sing_box_format: tar.gz
            interface: lo
            executable: vpn-ru-proxy
          - runner: windows-2025
            platform: windows-x64
            sing_box_platform: windows-amd64
            sing_box_format: zip
            executable: vpn-ru-proxy.exe
    defaults:
      run:
        shell: bash
    env:
      SING_BOX_VERSION: '1.14.4'
      PLATFORM: ${{ matrix.platform }}
      SING_BOX_PLATFORM: ${{ matrix.sing_box_platform }}
      SING_BOX_FORMAT: ${{ matrix.sing_box_format }}
      TEST_INTERFACE: ${{ matrix.interface }}
      EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test Rust helper
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Test Chrome proxy settings
        run: node --test scripts/test-background.cjs
      - name: Install sing-box for smoke checks
        run: |
          name="sing-box-$SING_BOX_VERSION-$SING_BOX_PLATFORM"
          mkdir -p "$RUNNER_TEMP/sing-box"
          cd "$RUNNER_TEMP/sing-box"
          curl --fail --location --retry 3 --output "$name.$SING_BOX_FORMAT" \
            "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/$name.$SING_BOX_FORMAT"
          if [[ "$SING_BOX_FORMAT" == 'zip' ]]; then
            python -m zipfile -e "$name.zip" .
          else
            tar -xzf "$name.tar.gz"
          fi
      - name: Exercise native registration and proxy lifecycle
        run: python scripts/smoke-test.py "target/release/$EXECUTABLE" "$RUNNER_TEMP/sing-box"
      - name: Package helper and extension
        run: |
          mkdir -p target/package/vpn-ru-proxy/bin
          cp "target/release/$EXECUTABLE" target/package/vpn-ru-proxy/bin/
          cp -R README.md chrome-extension target/package/vpn-ru-proxy/
          cd target/package
          python -m zipfile -c "vpn-ru-proxy-chrome-$PLATFORM.zip" vpn-ru-proxy
      - uses: actions/upload-artifact@v7
        with:
          path: target/package/vpn-ru-proxy-chrome-${{ matrix.platform }}.zip
          archive: false
          if-no-files-found: error
